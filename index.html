<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Under Maintenance</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            text-align: center;
            padding: 20px;
            background: linear-gradient(180deg, #0d0a1a 0%, #1a1333 50%, #0f1a2e 100%);
            position: relative;
            overflow: hidden;
        }

        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, rgba(255,255,255,0.8), transparent),
                radial-gradient(2px 2px at 40px 70px, rgba(200,180,255,0.7), transparent),
                radial-gradient(1px 1px at 90px 40px, rgba(255,255,255,0.6), transparent),
                radial-gradient(2px 2px at 130px 80px, rgba(152,251,200,0.6), transparent),
                radial-gradient(1px 1px at 160px 120px, rgba(255,255,255,0.5), transparent),
                radial-gradient(2px 2px at 200px 50px, rgba(200,180,255,0.7), transparent),
                radial-gradient(1px 1px at 250px 160px, rgba(152,251,200,0.5), transparent),
                radial-gradient(2px 2px at 300px 90px, rgba(255,255,255,0.6), transparent),
                radial-gradient(1px 1px at 350px 200px, rgba(200,180,255,0.5), transparent),
                radial-gradient(2px 2px at 400px 150px, rgba(152,251,200,0.6), transparent);
            background-size: 400px 400px;
            animation: twinkle 8s ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .aurora {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .aurora::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                conic-gradient(from 0deg at 30% 70%, 
                    transparent 0deg, 
                    rgba(183, 148, 212, 0.15) 60deg, 
                    transparent 120deg,
                    rgba(152, 251, 200, 0.1) 180deg,
                    transparent 240deg,
                    rgba(183, 148, 212, 0.12) 300deg,
                    transparent 360deg);
            animation: aurora-spin 30s linear infinite;
        }

        .aurora::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                conic-gradient(from 180deg at 70% 30%, 
                    transparent 0deg, 
                    rgba(152, 251, 200, 0.12) 60deg, 
                    transparent 120deg,
                    rgba(183, 148, 212, 0.1) 180deg,
                    transparent 240deg,
                    rgba(152, 251, 200, 0.15) 300deg,
                    transparent 360deg);
            animation: aurora-spin 25s linear infinite reverse;
        }

        @keyframes aurora-spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .wave {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 200%;
            height: 300px;
            background: linear-gradient(180deg, transparent 0%, rgba(152, 251, 200, 0.03) 50%, rgba(183, 148, 212, 0.05) 100%);
            border-radius: 50% 50% 0 0;
            animation: wave 15s ease-in-out infinite;
        }

        .wave:nth-child(2) {
            animation-delay: -5s;
            opacity: 0.5;
            background: linear-gradient(180deg, transparent 0%, rgba(183, 148, 212, 0.03) 50%, rgba(152, 251, 200, 0.05) 100%);
        }

        @keyframes wave {
            0%, 100% { transform: translateX(0) translateY(0); }
            50% { transform: translateX(-25%) translateY(-20px); }
        }

        .container {
            max-width: 600px;
            position: relative;
            z-index: 1;
        }

        .error-code-wrapper {
            perspective: 1000px;
            margin-bottom: 30px;
        }

        .error-code {
            font-size: clamp(7rem, 22vw, 12rem);
            font-weight: 900;
            line-height: 1;
            display: inline-block;
            transform-style: preserve-3d;
            animation: rotate3d 8s ease-in-out infinite;
            position: relative;
        }

        .error-code span {
            display: inline-block;
            background: linear-gradient(135deg, #c9a0dc 0%, #98fbc8 50%, #b794d4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            position: relative;
            text-shadow: none;
            animation: letter-float 4s ease-in-out infinite;
        }

        .error-code span:nth-child(1) { animation-delay: 0s; }
        .error-code span:nth-child(2) { animation-delay: 0.2s; }
        .error-code span:nth-child(3) { animation-delay: 0.4s; }

        .error-code::before {
            content: '404';
            position: absolute;
            left: 0;
            top: 0;
            transform: translateZ(-50px) translateY(8px);
            opacity: 0.3;
            background: linear-gradient(135deg, #6b4d8a 0%, #3d7a5a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: blur(2px);
        }

        .error-code::after {
            content: '404';
            position: absolute;
            left: 0;
            top: 0;
            transform: translateZ(-100px) translateY(16px);
            opacity: 0.15;
            background: linear-gradient(135deg, #4a3660 0%, #2a5540 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: blur(4px);
        }

        @keyframes rotate3d {
            0%, 100% { 
                transform: rotateX(10deg) rotateY(-10deg); 
            }
            25% { 
                transform: rotateX(-5deg) rotateY(10deg); 
            }
            50% { 
                transform: rotateX(-10deg) rotateY(15deg); 
            }
            75% { 
                transform: rotateX(5deg) rotateY(-5deg); 
            }
        }

        @keyframes letter-float {
            0%, 100% { transform: translateY(0) rotateY(0deg); }
            50% { transform: translateY(-10px) rotateY(5deg); }
        }

        .glow-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(152, 251, 200, 0.1) 0%, transparent 70%);
            animation: pulse-ring 4s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes pulse-ring {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            50% { transform: translate(-50%, -50%) scale(1.3); opacity: 0.2; }
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 20px;
            font-weight: 600;
            color: #e6e6fa;
        }

        p {
            font-size: 1.1rem;
            color: #a99bbe;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        a {
            color: #98fbc8;
            text-decoration: none;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 4px;
            background: rgba(152, 251, 200, 0.1);
            transition: all 0.3s ease;
        }

        a:hover {
            background: rgba(152, 251, 200, 0.25);
            box-shadow: 0 0 25px rgba(152, 251, 200, 0.4);
        }

        .dots {
            margin-top: 40px;
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #9683b8;
            animation: pulse 1.5s ease-in-out infinite;
        }

        .dot:nth-child(1) { animation-delay: 0s; }
        .dot:nth-child(2) { animation-delay: 0.3s; }
        .dot:nth-child(3) { animation-delay: 0.6s; }

        @keyframes pulse {
            0%, 100% { 
                opacity: 0.4; 
                transform: scale(0.8);
                background: #9683b8;
                box-shadow: none;
            }
            50% { 
                opacity: 1; 
                transform: scale(1.4);
                background: #98fbc8;
                box-shadow: 0 0 20px rgba(152, 251, 200, 0.6);
            }
        }
    </style>
</head>
<body>
    <div class="stars"></div>
    <div class="aurora"></div>
    <div class="wave"></div>
    <div class="wave"></div>
    
    <div class="container">
        <div class="error-code-wrapper">
            <div class="glow-ring"></div>
            <div class="error-code">
                <span>4</span><span>0</span><span>4</span>
            </div>
        </div>
        <p>I'm working hard to bring you something great. Please check back later!</p>
        <p>For inquiries, contact me at <a href="mailto:van@vancontact.com">van@vancontact.com</a></p>
        <div class="dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>
</body>
</html>
